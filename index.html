<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOIR STUDIO · Ropa oscura</title>
<style>
  :root { --bg:#0E0C12; --card:#17141D; --line:#2C2736; --bone:#F2EDE4; --muted:#A39BB0; --gold:#D4A373; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:radial-gradient(circle at 20% 0%, #231C2E 0%, var(--bg) 55%);
         color:var(--bone); font-family:"Helvetica Neue", Arial, sans-serif; }
  main { width:100%; max-width:480px; text-align:center; }
  .brand { font-family:Georgia, serif; font-size:1.1rem; letter-spacing:.35em; color:var(--gold); margin-bottom:28px; }
  svg { width:64px; height:64px; stroke:var(--gold); fill:none; stroke-width:2; margin-bottom:12px; }
  h1 { margin:0 0 12px; font-family:Georgia, serif; font-size:clamp(2rem, 8vw, 2.9rem); line-height:1.1; font-weight:normal; }
  .sub { margin:0 0 24px; color:var(--muted); line-height:1.6; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:28px; }
  .chips span { padding:6px 14px; border:1px solid var(--line); border-radius:999px; font-size:.85rem; color:var(--bone); }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; text-align:left; }
  label { display:block; margin-bottom:8px; font-size:.9rem; color:var(--muted); }
  input { width:100%; padding:14px; font-size:1rem; color:var(--bone); background:var(--bg);
          border:1px solid var(--line); border-radius:8px; }
  input::placeholder { color:#6d667a; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  button { margin-top:14px; width:100%; padding:14px; font-size:1rem; font-weight:bold; color:#1a1208;
           background:var(--gold); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #msg { margin:14px 0 0; min-height:1.3em; font-size:.95rem; }
  .ok { color:#7ddba3; } .err { color:#ff8a80; }
  .fine { margin-top:16px; font-size:.8rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="brand">NOIR STUDIO</div>
  <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 14a5 5 0 1 1 5 5c-3 1-5 3-5 7v3M32 29 6 46a3 3 0 0 0 2 5h48a3 3 0 0 0 2-5z" stroke-linejoin="round" stroke-linecap="round"/></svg>
  <h1>Vístete de oscuro. Llega primero.</h1>
  <p class="sub">Suscríbete y recibe un 15% de descuento en tu primera compra, más acceso anticipado a cada colección.</p>

  <div class="chips" aria-label="Categorías"><span>Camisetas</span><span>Hoodies</span><span>Chaquetas</span><span>Jeans</span><span>Accesorios</span></div>

  <form id="form" novalidate>
    <label for="email">Tu correo electrónico</label>
    <input id="email" name="user_email" type="email" placeholder="tu@correo.com" required autocomplete="email">
    <button id="btn" type="submit">Quiero mi 15% de descuento</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="fine">Sin spam. Puedes cancelar cuando quieras.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script>
  const PUBLIC_KEY  = "gt-OfPPbH-5tqZiBr";
  const SERVICE_ID  = "service_w7qvguh";
  const TEMPLATE_ID = "template_3xgp5q4";

  const form = document.getElementById("form"), input = document.getElementById("email"),
        btn = document.getElementById("btn"), msg = document.getElementById("msg");

  if (window.emailjs) emailjs.init({ publicKey: PUBLIC_KEY });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "";
    if (!window.emailjs) {
      msg.textContent = "Error: no cargó la librería de EmailJS. Revisa tu conexión.";
      msg.className = "err";
      return;
    }
    if (!input.checkValidity()) {
      msg.textContent = "Escribe un correo válido, por ejemplo tu@correo.com.";
      msg.className = "err";
      return;
    }
    btn.disabled = true;
    msg.textContent = "Enviando…";
    const correo = input.value.trim();
    try {
      // Se envía con varios nombres para que coincida con el campo "To Email" de la plantilla
      await emailjs.send(
        SERVICE_ID,
        TEMPLATE_ID,
        { user_email: correo, to_email: correo, email: correo },
        { publicKey: PUBLIC_KEY }
      );
      msg.textContent = "¡Listo! Revisa tu correo (y la carpeta de spam).";
      msg.className = "ok";
      form.reset();
    } catch (err) {
      console.error("EmailJS error:", err);
      msg.textContent = "Error " + (err.status || "") + ": " + (err.text || err.message || "desconocido");
      msg.className = "err";
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
